<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ECH Digital Library</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Poppins',sans-serif;}
body{background:linear-gradient(135deg,#0f2027,#203a43,#2c5364);color:white}

/* NAVBAR */
nav{
display:flex;
align-items:center;
justify-content:space-between;
padding:15px 40px;
background:rgba(0,0,0,0.4);
position:sticky;top:0;
}

.logo-area h2{color:#4fd1ff}

/* SEARCH */
.search-box{
flex:1;
display:flex;
justify-content:center;
}
.search-box input{
width:60%;
padding:8px 15px;
border-radius:20px;
border:none;
outline:none;
}

/* HERO */
.hero{text-align:center;padding:80px 20px}
.hero h1{color:#4fd1ff}

/* COLLECTION */
.collection{text-align:center;padding:60px 20px}
.book-grid{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(200px,1fr));
gap:20px;
max-width:1000px;margin:auto;
}
.book-card{
background:rgba(255,255,255,0.1);
padding:20px;
border-radius:15px;
transition:0.3s;
}
.book-card:hover{
transform:translateY(-8px);
box-shadow:0 0 20px #4fd1ff;
}

/* CONTACT + GAME */
.contact-wrapper{
display:flex;
justify-content:center;
align-items:flex-start;
gap:40px;
flex-wrap:wrap;
padding:60px 20px;
}

.contact{text-align:center}
.contact-box{
display:flex;
gap:20px;
justify-content:center;
margin-top:20px;
}

.contact-item{
width:70px;height:70px;border-radius:50%;
display:flex;align-items:center;justify-content:center;
font-size:28px;color:white;
}

.wa{background:#25D366}
.ig{background:linear-gradient(45deg,#fd1d1d,#e1306c,#833ab4)}
.email{background:#4fd1ff}

/* GAME */
.game-box{
background:rgba(255,255,255,0.1);
padding:25px;
border-radius:15px;
width:280px;
backdrop-filter:blur(10px);
}

.game-box input{
width:100%;
padding:10px;
margin:10px 0;
border-radius:10px;
border:none;
}

.game-box button{
padding:8px 12px;
border:none;
border-radius:20px;
background:#4fd1ff;
cursor:pointer;
margin-right:5px;
}

/* FOOTER */
footer{text-align:center;padding:20px;background:rgba(0,0,0,0.4);}
</style>
</head>

<body>

<!-- HOME -->
<div id="homePage" style="display:flex;flex-direction:column;">

<nav>
  <div class="logo-area">
    <h2>ECH Digital Library</h2>
  </div>

  <!-- SEARCH -->
  <div class="search-box">
    <input type="text" id="searchInput" placeholder="Cari buku...">
  </div>

  <div class="menu-btn">
    <i class="fas fa-bars"></i>
  </div>
</nav>

<section class="hero">
<h1>Welcome to <span>ECH Digital Library</span></h1>
</section>

<section class="collection">
<h2>Koleksi Buku</h2>

<div class="book-grid" id="bookList">
<div class="book-card">Fisika SMA</div>
<div class="book-card">Biologi SMA</div>
<div class="book-card">Matematika</div>
<div class="book-card">Sejarah</div>
</div>
</section>

<!-- CONTACT + GAME -->
<div class="contact-wrapper">

<div class="contact">
<h2>Contact</h2>
<div class="contact-box">
<a href="#" class="contact-item wa"><i class="fab fa-whatsapp"></i></a>
<a href="#" class="contact-item ig"><i class="fab fa-instagram"></i></a>
<a href="#" class="contact-item email"><i class="fas fa-envelope"></i></a>
</div>
</div>

<div class="game-box">
<h3>🎮 Game Matematika</h3>
<p id="question"></p>
<input type="number" id="answer" placeholder="Jawaban kamu">
<button onclick="checkAnswer()">Cek</button>
<button onclick="newQuestion()">Soal Baru</button>
<p id="result"></p>
</div>

</div>

<footer>© 2026 ECH Digital Library</footer>

</div>

<script>
/* SEARCH */
document.getElementById("searchInput").addEventListener("keyup", function(){
let filter = this.value.toLowerCase();
let books = document.querySelectorAll(".book-card");

books.forEach(b=>{
b.style.display = b.innerText.toLowerCase().includes(filter) ? "block":"none";
});
});

/* GAME */
let a,b;

function newQuestion(){
a=Math.floor(Math.random()*10);
b=Math.floor(Math.random()*10);
document.getElementById("question").innerText = `Berapa ${a} + ${b} ?`;
document.getElementById("answer").value="";
document.getElementById("result").innerText="";
}

function checkAnswer(){
let ans = document.getElementById("answer").value;
if(parseInt(ans)===a+b){
document.getElementById("result").innerText="✅ Benar!";
}else{
document.getElementById("result").innerText="❌ Salah!";
}
}

newQuestion();
</script>

</body>
</html>
