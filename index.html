<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ECH Digital Library</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Poppins',sans-serif;}
body{background:linear-gradient(135deg,#0f2027,#203a43,#2c5364);color:white}

/* LOGIN */
.auth-page{display:flex;justify-content:center;align-items:center;height:100vh}
.auth-box{background:rgba(255,255,255,0.1);padding:35px;border-radius:15px;width:320px;text-align:center}
.auth-box input{width:100%;padding:10px;margin:10px 0;border:none;border-radius:6px}
.auth-box button{width:100%;padding:10px;border:none;border-radius:20px;background:#4fd1ff}

/* HOME */
#homePage{display:none}

/* NAV */
nav{display:flex;justify-content:space-between;padding:15px 40px;background:rgba(0,0,0,0.4)}
.menu-btn{font-size:25px;cursor:pointer}

/* HERO */
.hero{padding:100px 20px;text-align:center}
.hero h1{font-size:45px;color:#4fd1ff;margin-bottom:20px}

/* COLLECTION */
.collection{padding:70px 20px;text-align:center}
.book-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:20px;max-width:1000px;margin:auto}
.book-card{background:rgba(255,255,255,0.1);padding:20px;border-radius:15px}

/* CONTACT + GAME */
.contact-game{display:flex;flex-wrap:wrap;justify-content:center;gap:40px;padding:70px}
.box{background:rgba(255,255,255,0.1);padding:20px;border-radius:15px;width:300px;text-align:center}

/* GAME */
input{padding:8px;border-radius:8px;border:none;margin:5px}

</style>
</head>

<body>

<!-- LOGIN -->
<div id="loginPage" class="auth-page">
<div class="auth-box">
<h2>ECH Digital Library</h2>
<form onsubmit="login(event)">
<input id="loginEmail" placeholder="Email" required>
<input id="loginPassword" placeholder="Password" required>
<button>Masuk</button>
</form>
</div>
</div>

<!-- HOME -->
<div id="homePage">

<nav>
<h2>ECH Digital Library</h2>
<div class="menu-btn">☰</div>
</nav>

<!-- HERO (FIXED) -->
<section class="hero">
<h1>Welcome to Esra Digital Library</h1>
<p>Ruang literasi digital untuk semua ✨</p>
</section>

<!-- KOLEKSI -->
<section class="collection">
<h2>Koleksi Buku Interaktif</h2>
<div class="book-grid">

<a href="#"><div class="book-card">Fisika</div></a>
<a href="#"><div class="book-card">Biologi</div></a>
<a href="#"><div class="book-card">Matematika</div></a>
<a href="#"><div class="book-card">Sejarah</div></a>

</div>
</section>

<!-- EVENT -->
<section class="collection">
<h2>Event</h2>
<div class="book-grid">
<div class="book-card">Lomba Essay</div>
<div class="book-card">Cerdas Cermat</div>
</div>
</section>

<!-- CONTACT + GAME -->
<section class="contact-game">

<div class="box">
<h3>Contact</h3>
<p>WhatsApp</p>
<p>Instagram</p>
</div>

<div class="box">
<h3>Game Matematika</h3>
<p id="soal"></p>
<input id="jawaban" placeholder="Jawaban">
<button onclick="cek()">Jawab</button>
<p id="hasil"></p>
</div>

</section>

</div>

<script>
function login(e){
e.preventDefault();
loginPage.style.display="none";
homePage.style.display="block";
}

/* GAME */
let a=Math.floor(Math.random()*10);
let b=Math.floor(Math.random()*10);
soal.innerText=a+" + "+b;

function cek(){
let j=parseInt(jawaban.value);
if(j===a+b){
hasil.innerText="Benar!";
}else{
hasil.innerText="Salah!";
}
}
</script>

</body>
</html>
